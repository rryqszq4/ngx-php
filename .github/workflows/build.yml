name: Build

on:
  push:
    paths:
      - "src/**"
      - "t/**"
      - "third_party/**"
      - ".github/**"
      - "config"
  pull_request:
    paths:
      - "src/**"
      - "t/**"
      - "third_party/**"
      - ".github/**"
      - "config"

# later try to pass it, and not repeat it in workflows 
env:
  DB_DATABASE: ngx_php
  DB_USER: ngx_php
  DB_PASSWORD: ngx_php

jobs:
  build_26-04:
    name: Ubuntu 26.04
    if: ${{ !contains(github.event.head_commit.message, '<compile') }}
    uses: ./.github/workflows/build_26.04.yml

  build_24-04:
    name: Ubuntu 24.04
    if: ${{ !contains(github.event.head_commit.message, '<compile') }}
    uses: ./.github/workflows/build_24.04.yml

  #build_22-04:
